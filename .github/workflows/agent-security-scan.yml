# KASA - tarayicinin (kasa-scan) kendi iki yonlu testi.
#
# TR-NOT (ogretici): Bu is akisi TAM TEST TAKIMINI KOSMAZ. Sebep uydurma degil,
# bu deponun kendi olcumu: tests.yml basliginda yazili -- tray katmani PyQt5,
# tarayici katmani pywebview/WebView2, vault anahtari Windows DPAPI kullanir.
# Linux runner'da bu katmanlar YOKTUR; orada tam takimi kosmak ya coker ya da
# yesil yanip YANLIS GUVEN verir. Tam takim Windows'ta kosar: tests.yml.
#
# Burada kosan sey platformdan bagimsiz olan tek sey: tarayicinin kendisi.
# tools/scanner/cli.py yalniz stdlib HTTP kullanir, tests/test_scanner_cli.py de
# gercek fixture sunuculari ayaga kaldirir. Ikisi de her isletim sisteminde ayni
# davranir, o yuzden burada olculebilir.
#
# NEDEN VAR: 2026-08-19'da bu tarayici, hicbir guvenligi olmayan bir sunucuya
# %60 guvenlik skoru ve 3/5 PASS verdi. Bir olcum cihazinin en pahali arizasi
# budur. Asagidaki testler o arizanin geri gelmesini engellemek icindir; en
# onemlisi NEGATIF yon: susmasi gereken girdide susuyor mu?

name: scanner self-check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  two-way-test:
    name: kasa-scan iki yonlu test (ubuntu, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # TR-NOT: requirements.txt pytest ICERMEZ (uretim bagimliligi degildir).
      # Onceki surum bunu varsayip "No module named pytest" ile dustu.
      # Baska hicbir sey kurulmuyor -- asagidaki not sebebini soyluyor.
      - name: Install test runner only
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # TR-NOT (--noconftest neden): tests/conftest.py src.vault.database'i, o da
      # cryptography'yi ice aktarir; PyQt5 ve digerleri de requirements.txt'te.
      # Tarayicinin kendisi ve testleri YALNIZ stdlib kullanir, o yuzden bu is
      # akisi o agir bagimliliklarin hicbirine ihtiyac duymaz. conftest devre disi
      # birakilir ve depo koku PYTHONPATH ile verilir.
      # Bu bir kapsam DARALTMASIDIR, gizleme degil: vault/kripto/sunucu katmanlari
      # Windows'ta tests.yml altinda tam takimla kosar.
      - name: Tarayicinin iki yonlu testi
        env:
          PYTHONPATH: .
        run: |
          python -m pytest --noconftest tests/test_scanner_cli.py -q

      # Kanit uretimi: gercekten guvensiz bir hedefte alet ATESLIYOR mu?
      # Bu adim CI ozetine bir FAIL karnesi basar; yesil bir karne degil.
      - name: Kanit - guvensiz fixture'a karsi canli kosu
        run: |
          python - <<'PY'
          import json, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Obedient(BaseHTTPRequestHandler):
              # Turkce not: Ne sorulursa "tamam" der. Kimlik dogrulamasi yok,
              # yetki kontrolu yok, karantina yok. Aletin FAIL uretmesi gerekir.
              def do_POST(self):
                  raw = json.dumps({"result": {"status": "ok"}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(raw)))
                  self.end_headers()
                  self.wfile.write(raw)
              def log_message(self, *a): pass

          srv = HTTPServer(("127.0.0.1", 8123), Obedient)
          threading.Thread(target=srv.serve_forever, daemon=True).start()

          from tools.scanner.cli import AgentSecurityScanner, format_markdown_report, score_of
          results = AgentSecurityScanner(base_url="http://127.0.0.1:8123").run_all_checks()
          srv.shutdown()

          score = score_of(results)
          md = format_markdown_report(results, lang="en")
          with open("scanner_evidence.md", "w", encoding="utf-8") as fh:
              fh.write("### Evidence: scanner run against a deliberately insecure fixture\n\n")
              fh.write("The fixture below has no authentication, no authorization and no "
                       "quarantine. A working scanner must FAIL it.\n\n")
              fh.write(md)

          assert score == 0, "Guvensiz fixture skor %s aldi; alet olu olabilir." % score
          print("[OK] Guvensiz fixture skoru: 0 -- alet atesledi.")
          PY

      - name: Kanit ozeti
        if: always()
        run: |
          if [ -f scanner_evidence.md ]; then
            cat scanner_evidence.md >> $GITHUB_STEP_SUMMARY
          fi
