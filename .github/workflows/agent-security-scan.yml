name: KASA AI Agent Security Scan

on:
  push:
    branches: [ main, master, security/* ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security-benchmark:
    name: Agent Security & Reference Monitor Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KASA Full Test Suite
        run: |
          python -m pytest -q

      - name: Run KASA Agent Security Scanner (CLI)
        run: |
          python -m tools.scanner.cli --output-md security_scan_report.md || true

      - name: Publish Security Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f security_scan_report.md ]; then
            cat security_scan_report.md >> $GITHUB_STEP_SUMMARY
          fi
