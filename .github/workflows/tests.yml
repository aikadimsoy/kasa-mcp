# KASA test CI - pytest'i her push/PR'da GERCEKTEN kosar.
#
# TR-NOT (ogretici): Bu is akisi YALNIZ Windows'ta kosar. Sebep uydurma degil, olcum:
#   - tray katmani PyQt5 (src/tray/app.py:3), tarayici katmani pywebview/WebView2
#     (src/browser/browser_window.py:1), vault anahtari DPAPI (src/vault/encryption.py).
#   Linux runner'da bu katmanlar YOK; orada yesil yanan bir CI yanlis guven verir.
#
# Python 3.12 SABIT. OLCUMUN DURUST KAPSAMI (abartmamak icin acikca yaziliyor):
#   docs/EXE_PACKAGING_LOG.md:104 "Spike-2 (pywebview penceresi), Py3.14: SEGFAULT
#   (exit 3)" olcumu MASAUSTU/EXE yolunda (Nuitka ile derlenmis ikili, pywebview
#   penceresi acilirken) yapildi; build_kasa.ps1:10 ve 29-31 bu yuzden 3.12 dayatir.
#   Bu olcum "test takimi 3.14'te cokuyor" DEMEZ - README.md:53 tam tersini kayda
#   gecirir: takim ve guvenlik tezgahi en son 3.14.5 altinda kosuldu. Python 3.13
#   HIC olculmedi.
# Bu is akisi yine de yalniz 3.12 kosar: sahibin dagittigi surum odur, matris
# Windows runner dakikasini ikiye katlar ve 3.13/3.14 icin bir hedef yoktur.
# Yani bu bir TERCIH; "3.12 disinda calismaz" diye olculmus bir iddia DEGILDIR.
#
# DURUSTLUK NOTU: asagida bazi test dosyalari DISLANIR. Her disleme icin sebep ve
# dosya:satir dayanagi yazildi. Disleme "gecti" demek DEGILDIR; kosulmadi demektir.

name: tests

on:
  push:
  pull_request:

# Ayni dal icin ust uste kosumlari iptal et (Windows runner dakikasi pahali).
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (windows, py3.12)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      # TR-NOT: cocuk sureclerin stdout'u da UTF-8 olsun.
      # OLCUM DAYANAGI: tests/test_bench_subprocess_encoding.py:76 bir alt-surece
      # Turkce ozel karakter (s-cedilla, dotless-i, g-breve) yazdirir. Runner'in yerel
      # kod sayfasi cp1252'dir ve bu karakterler cp1252'de YOKTUR -> alt surec
      # UnicodeEncodeError ile bos cikti verir -> test kirmizi yanar. PYTHONIOENCODING
      # miras alinir ve bu yanlis-kirmiziyi (ortam farki, kod hatasi degil) kapatir.
      # Sadece G/C kodlamasini sabitler; open() varsayilanina dokunmaz.
      PYTHONIOENCODING: utf-8

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip


      - name: Bagimliliklari kur
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # TR-NOT: asagidakiler requirements.txt'te YOK ama testlerin kosmasi icin
          # ZORUNLU. Uydurma degil, import zincirinden okundu:
          #   pytest    -> test kosucusu (calisma-ani bagimliligi degil, o yuzden
          #                requirements.txt'e eklenmedi)
          #   httpx     -> tests/conftest.py:11 'fastapi.testclient.TestClient';
          #                starlette'in TestClient'i httpx uzerine kuruludur
          #   pywebview -> src/browser/browser_window.py:1 'import webview'; bu modulu
          #                tests/test_b1_bootstrap.py:13 ve tests/test_l4_toctou_gate.py:14
          #                import eder. (Sahibin makinesinde olculen surum 6.2.1 -
          #                build_kasa.ps1:56; testler yalniz 'import webview'in calismasini
          #                istedigi icin alt sinir sabitlenmedi.)
          pip install pytest httpx pywebview
          # TR-NOT (2026-08-03, ILK CI kosusundan OLCULDU): asagidaki uc alet
          # tools/security_bench/checks/scan.py tarafindan importlib.util.find_spec ile
          # aranir; YOKSA ilgili kontrol SKIP'e duser ve scan.run() hicbir dis surec
          # cagirmaz. Bunun sonucu "test gecti" degil, testin OLCEMEMESIdir:
          #   test_bench_subprocess_encoding.py:60  "scan.run() hic dis alet cagirmadi"
          #   test_bench_scan_scope.py:121          cmd None -> AttributeError
          # yani 6 test kirmizi yandi. Aletleri kurmak, testleri susturmaktan farkli
          # olarak olcumu GERI GETIRIR -- dislemek olcumu kaybettirirdi.
          #   bandit         -> scan.py:38  SCAN-BANDIT
          #   pip-audit      -> scan.py:126 SCAN-DEPS   (modul adi: pip_audit)
          #   detect-secrets -> scan.py:207 SCAN-SECRETS
          pip install bandit pip-audit detect-secrets

      - name: Kurulan surumleri damgala
        shell: pwsh
        run: |
          python -c "import sys; print('python', sys.version)"
          pip list

      # ---------------------------------------------------------------------------
      # DISLENEN TESTLER (her biri icin sebep + dayanak; 'gecti' DEGIL 'kosulmadi'):
      #
      # tests/browser
      #   Tarayici odakli dizin; canli WebView2/pywebview yuzeyine bagli. Proje
      #   kuralina gore ayri kapida kosar (dayanak: tests/test_browser_gate.py:64
      #   "Canli WebView2 kosumu AYRI kapi (Kapi-2)" ve tests/test_b1_bootstrap.py:5
      #   "Canli CoreWebView2 ContinueWith davranisi AYRI kapi (Kapi-2)"; ayrica
      #   CONTRIBUTING.md:81-82 ayni dislemeyi yerel kosum icin de yazar).
      #
      # tests/test_fp_b2_webgl.py
      #   tests/test_fp_b2_webgl.py:20 'run_gate(mode="fingerprint")' GERCEK KASA
      #   tarayicisini acar ve 8901 portundaki adversary sunucusuna gider. Headless
      #   runner'da GPU/WebView2 yok -> bu test CI'da olcum yapamaz.
      #
      # tests/test_distill_injection.py
      #   tests/test_distill_injection.py:25 'DistillEngine(...).run_batch()' CANLI
      #   Ollama (localhost:11434) cagirir; monkeypatch YOK. Ollama olmayinca
      #   src/distill/engine.py:188-189 erken doner, vault'a hicbir fact yazilmaz ve
      #   testin "enjekte edilen fact yazilmadi" iddiasi BOSA gecer = YANLIS YESIL.
      #   Bu yuzden bilerek DISLANDI: kosulmayan test, sahte gecen testten iyidir.
      #   Gercek kosumu icin yerelde Ollama ayakta iken: pytest tests/test_distill_injection.py
      #
      # NOT (tam dislenmedi): tests/test_advanced_redteam.py icindeki
      #   test_denial_of_wallet_batch_bounded da Ollama'ya ulasmaya calisir, ama olctugu
      #   sey SQL 'LIMIT ?' siniridir (src/distill/engine.py:116-118) ve model erisilemese
      #   bile processed=len(events) uzerinden GERCEKTEN olculur. Diger iki test
      #   urlopen'i monkeypatch eder (deterministik). Bu yuzden dosya CI'da kalir.
      # ---------------------------------------------------------------------------
      # ---------------------------------------------------------------------------
      # IMPORT KAYNAGI KALKANI - "yesil ama yanlis agac" sonucunu kirmiziya cevirir.
      #
      # GECMIS: bu is akisinda bir D:\kasa junction adimi ve pytest icin
      # working-directory: 'D:\kasa' vardi. Sebebi 33 test dosyasinin sys.path'e sabit
      # "d:/kasa" eklemesiydi; junction checkout'u o yola baglayarak sorunu ORTUYORDU.
      # Kalici cozum 2026-08-03'te yapildi: kokler artik __file__'dan turetiliyor,
      # dolayisiyla junction da ozel calisma dizini de gereksiz.
      #
      # NEDEN BU ADIM VAR: sabit yolun asil tehlikesi "dosya bulunamadi" DEGILDI --
      # sys.path'in BASINA eklenen bir kok yuzunden, baska bir dizinden kosulan takim
      # bile modulleri O depodan import edip YESIL bir YANLIS-PASS uretebiliyordu
      # (bu olcum bizzat yapildi ve gorulen sey buydu). Bu adim tam olarak onu olcer:
      # import edilen modul bu checkout'un icinden mi geliyor? Ucuz, ve regresyonu
      # sessiz kalmaktan cikarir. Bagimliliklardan SONRA kosar (cell_crypt cryptography ister).
      # ---------------------------------------------------------------------------
      - name: 'Import kaynagi bu checkout mu (yanlis-PASS kalkani)'
        shell: pwsh
        run: |
          python -c @'
          import os, sys, pathlib
          sys.path.insert(0, os.getcwd())
          import src.vault.cell_crypt as m
          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          got = pathlib.Path(m.__file__).resolve()
          print("workspace :", ws)
          print("import    :", got)
          if ws not in got.parents:
              sys.exit("HATA: moduller bu checkout DISINDAN import edildi -> pytest sonucu bu PR hakkinda DEGILDIR.")
          print("dogrulandi: import kaynagi = checkout")
          '@

      - name: pytest
        shell: pwsh
        run: pytest tests/ -q --ignore=tests/browser --ignore=tests/test_fp_b2_webgl.py --ignore=tests/test_distill_injection.py

  # ===========================================================================
  # PACKAGE-INSTALL-E2E (GATING) — "CI yesil != urun calisiyor" ilkesinin kapisi.
  #
  # NEDEN AYRI IS: yukaridaki pytest isi KAYNAK CHECKOUT'u requirements.txt ile
  # kurup dogrudan checkout kodunu test eder; wheel'in GERCEKTEN calistigini
  # kanitlamaz. Bu is (ChatGPT operator karari 2026-08-21) tam onu olcer:
  #   checkout -> python -m build --wheel -> AYRI temiz venv'e kur -> checkout
  #   DISINDA bos cwd + fake HOME -> gercek console entry-point'ler.
  # Kritik dogrulama: `import src` SITE-PACKAGES'tan gelmeli; yanlislikla kaynak
  # agactan import edilirse (GITHUB_WORKSPACE icinde) harness FAIL eder.
  # Olcer: wheel-kod, import-kaynagi, kasa-server health, kasa-admin token+grant,
  # kasa-mcp 6 tool, write/read, restart-persistence, system.security+admin.config
  # quarantine (deterministik), saldiri sonrasi normal write. Harness:
  # tools/package_install_e2e.py (yerelde de kosuldu, iki-yonlu dogrulandi).
  # ===========================================================================
  package-install-e2e:
    name: package-install-e2e (windows, py3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python 3.12 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Wheel uret (build backend)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
      - name: Ayri temiz venv'e wheel kur (checkout'tan BAGIMSIZ)
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/pkgvenv"
          "$RUNNER_TEMP/pkgvenv/Scripts/python.exe" -m pip install --upgrade pip
          "$RUNNER_TEMP/pkgvenv/Scripts/python.exe" -m pip install dist/*.whl
      - name: 'Packaged E2E (repo-DISI cwd + fake HOME + gercek entry-point)'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/e2ecwd" "$RUNNER_TEMP/fakehome"
          cp tools/package_install_e2e.py "$RUNNER_TEMP/e2ecwd/"
          cd "$RUNNER_TEMP/e2ecwd"
          USERPROFILE="$RUNNER_TEMP/fakehome" HOME="$RUNNER_TEMP/fakehome" \
            "$RUNNER_TEMP/pkgvenv/Scripts/python.exe" package_install_e2e.py

  # ===========================================================================
  # LINUX PROBE (non-gating) — Windows-DISI calismayi ILK KEZ olcer.
  #
  # NEDEN continue-on-error: Windows isi tek GATING kapidir. Bu is BUILD'i
  # bloklamaz; amaci README'nin "Windows only" sinirinin KANIT tarafini uretmek:
  # cekirdek (vault fallback-crypto + server + adapter + deterministik guvenlik
  # mantigi) Linux'ta gercekten kosuyor mu? Yesil/kirmizi bir KAPI degil, bir
  # OLCUMDUR. Plan: once probe (gecen alt kumeyi gor), sonra gecen kumeyi ayri
  # bir gating Linux kapisi olarak sabitle.
  #
  # DPAPI Linux'ta no-op degil: src/vault/encryption.py:7 platforma gore
  # cryptography-tabanli AES-GCM/PBKDF2 fallback'e duser (IS_WINDOWS=False yolu).
  #
  # EK DISLEMELER (Windows isindekilere gore): asagidaki uc dosya modul
  # duzeyinde 'src.browser.browser_window' -> 'import webview' zincirini ceker;
  # pywebview Linux'ta GUI backend'i (GTK/WebKit) ister ve headless runner'da
  # collection'i kirar. Bunlar zaten masaustu/tarayici testleri.
  #   tests/test_b1_bootstrap.py:18   import src.browser.browser_window
  #   tests/test_browser_optin_gate.py:33  from src.browser import browser_window
  #   tests/test_l4_toctou_gate.py:19  import src.browser.browser_window
  # PyQt5/pywebview KURULMAZ (cekirdek Linux'ta onlara ihtiyac duymaz; olculdu).
  # ===========================================================================
  linux-probe:
    name: pytest (linux, py3.12) cross-platform PROBE (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Cekirdek + test bagimliliklari (GUI YOK)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic cryptography "mcp>=1.2,<2"
          pip install pytest httpx bandit pip-audit detect-secrets
      - name: pytest (browser/webview import eden dosyalar HARIC)
        run: |
          pytest tests/ -q \
            --ignore=tests/browser \
            --ignore=tests/test_fp_b2_webgl.py \
            --ignore=tests/test_distill_injection.py \
            --ignore=tests/test_b1_bootstrap.py \
            --ignore=tests/test_browser_optin_gate.py \
            --ignore=tests/test_l4_toctou_gate.py
